default:
  image: golang:1.26

  cache:
    key:
      files:
        - go.mod
    paths:
      - .go/pkg/mod/

variables:
  GOPATH: $CI_PROJECT_DIR/.go

stages:
  - test
  - build
  - deploy

format:
  stage: test
  script:
    - go fmt $(go list ./... | grep -v /vendor/)
    - go vet $(go list ./... | grep -v /vendor/)

go-mod-tidy:
  stage: test
  script:
    - go mod tidy -diff

go-test:
  stage: test
  script:
    - go test -race ./...

# Build-check the VitePress documentation site on branches that touch it, so a
# broken docs change (dead link, bad config) fails the MR instead of the deploy
# on main. VitePress link checking runs as part of the build.
docs:
  stage: test
  image: node:24
  cache:
    key: vitepress
    paths:
      - website/node_modules/
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - website/**/*
  script:
    - cd website
    - npm ci
    - npm run docs:build

go-build:
  stage: build
  script:
    # Stamp the build so /health and /info report the tag (or a dev version
    # carrying the commit sha) instead of the compiled-in fallback.
    - go build -ldflags "-X main.buildVersion=${CI_COMMIT_TAG:-0.0.0-dev+${CI_COMMIT_SHORT_SHA}}"
  artifacts:
    paths:
      - freedom-names
    expire_in: 1 week

# Build the documentation site on the default branch and publish it as a
# `public/` artifact. This is NOT GitLab Pages: the artifact is picked up by the
# external artifact deployer, which watches for deployment jobs via webhook and
# pushes the site to https://freedomnames.org. The `environment:` block below is
# what makes this a deployment job (and therefore what triggers the webhook), so
# it must stay even though nothing here talks to the server directly.
docs-deploy:
  stage: deploy
  image: node:24
  cache:
    key: vitepress
    paths:
      - website/node_modules/
  rules:
    - if: $CI_PROJECT_NAMESPACE == "freedom-names" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cd website
    - npm ci
    - npm run docs:build
    # The deployer expects the site at the top level of the artifact, so lift it
    # out of website/docs/.vitepress/ and into ./public at the repo root.
    - mv docs/.vitepress/dist "$CI_PROJECT_DIR/public"
  environment:
    name: website
    url: https://freedomnames.org
  artifacts:
    name: "FreedomNames website $CI_COMMIT_SHORT_SHA"
    expire_in: 1 month
    paths:
      - public

# Cross-compile the full release matrix (linux/windows/darwin x amd64/arm64)
# and package each binary as a tarball (.zip for windows). Tag pipelines only.
go-release:
  stage: build
  rules:
    - if: $CI_PROJECT_NAMESPACE == "freedom-names" && $CI_COMMIT_TAG
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends zip
  script:
    - export APP_VERSION=${CI_COMMIT_TAG}
    - ./scripts/build-release.sh
  artifacts:
    name: "FreedomNames $CI_COMMIT_TAG binaries"
    expire_in: 1 month
    paths:
      - build_release/freedom-names-*.tar.gz
      - build_release/freedom-names-*.zip

# Add asset links to the (UI-created) GitLab release and mirror the binaries
# to the GitHub release. Tag pipelines only.
release:
  stage: deploy
  image: serversideup/github-cli:latest
  needs:
    - job: go-release
      artifacts: true
  rules:
    - if: $CI_PROJECT_NAMESPACE == "freedom-names" && $CI_COMMIT_TAG
  script:
    - export APP_VERSION=${CI_COMMIT_TAG}
    - ./scripts/create-release-links.sh

    # GitHub Sync (fallback to only upload if creating a release fails).
    # Uses the GH_TOKEN environment variable from GitLab CI/CD variables.
    - |
      gh release create "$CI_COMMIT_TAG" \
        build_release/freedom-names-* \
        --repo "FreedomNames/FreedomNames" \
        --title "FreedomNames $CI_COMMIT_TAG" \
        --notes "FreedomNames Release $CI_COMMIT_TAG" || \
      gh release upload "$CI_COMMIT_TAG" \
        build_release/freedom-names-* \
        --repo "FreedomNames/FreedomNames" \
        --clobber
  environment:
    name: production
    url: https://github.com/FreedomNames/FreedomNames/releases
  artifacts:
    name: "FreedomNames $CI_COMMIT_TAG"
    expire_in: 3 months
    paths:
      - build_release/freedom-names-*.tar.gz
      - build_release/freedom-names-*.zip
