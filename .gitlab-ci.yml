# Pushing a new commit to a branch cancels the previous pipeline for that same
# branch, so a rapid series of pushes does not queue up superseded runs.
# `interruptible` only cancels jobs that opted in, and the default is `false`,
# hence the `default: interruptible: true` below. Deploy jobs opt back out: a
# publish that is already running should finish rather than be killed halfway.
workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  image: golang:1.26
  interruptible: true

  cache:
    key:
      files:
        - go.mod
    paths:
      - .go/pkg/mod/

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  # Canonical release downloads live in the versioned Generic Package Registry
  # package, not in the expiring artifacts of the build job.
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freedom-names/${CI_COMMIT_TAG}"

stages:
  - test
  - build
  - deploy

format:
  stage: test
  script:
    - go fmt $(go list ./... | grep -v /vendor/)
    - go vet $(go list ./... | grep -v /vendor/)

go-mod-tidy:
  stage: test
  script:
    - go mod tidy -diff

go-test:
  stage: test
  script:
    - go test -race ./...

# Build-check the VitePress documentation site on branches that touch it, so a
# broken docs change (dead link, bad config) fails the MR instead of the deploy
# on main. VitePress link checking runs as part of the build.
docs:
  stage: test
  image: node:24
  cache:
    key: vitepress
    paths:
      - website/node_modules/
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - website/**/*
  script:
    - cd website
    - npm ci
    - npm run build

go-build:
  stage: build
  script:
    # Stamp the build so /health and /info report the tag (or a dev version
    # carrying the commit sha) instead of the compiled-in fallback.
    #
    # -X matches the version symbol by its full import path: if that path is
    # ever wrong the linker silently patches nothing and every build reports
    # 0.0.0-dev, so the --version check below is what actually catches it.
    - go build -ldflags "-X gitlab.melroy.org/freedom-names/freedom-names/internal/version.Version=${CI_COMMIT_TAG:-0.0.0-dev+${CI_COMMIT_SHORT_SHA}}" -o freedom-names ./cmd/freedom-names
    - ./freedom-names --version
    - test "$(./freedom-names --version)" != "freedom-names 0.0.0-dev"
  artifacts:
    paths:
      - freedom-names
    expire_in: 1 week

# Build the documentation site on the default branch and publish it as a
# `public/` artifact. This is NOT GitLab Pages: the artifact is picked up by the
# external artifact deployer, which watches for deployment jobs via webhook and
# pushes the site to https://freedomnames.org. The `environment:` block below is
# what makes this a deployment job (and therefore what triggers the webhook), so
# it must stay even though nothing here talks to the server directly.
docs-deploy:
  stage: deploy
  image: node:24
  interruptible: false
  cache:
    key: vitepress
    paths:
      - website/node_modules/
  # Only redeploy when the site (or this job's own definition) actually changes,
  # so a Go-only commit does not rebuild and re-publish an identical site.
  # `.gitlab-ci.yml` is watched too: without it, a change to the build steps
  # below would never reach production.
  rules:
    - if: $CI_PROJECT_NAMESPACE == "freedom-names" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - website/**/*
        - .gitlab-ci.yml
  script:
    - cd website
    - npm ci
    - npm run build
    # The deployer expects the site at the top level of the artifact, so lift it
    # out of website/docs/.vitepress/ and into ./public at the repo root.
    - mv docs/.vitepress/dist "$CI_PROJECT_DIR/public"
  environment:
    name: website
    url: https://freedomnames.org
  artifacts:
    name: "FreedomNames website $CI_COMMIT_SHORT_SHA"
    expire_in: 1 month
    paths:
      - public

# Cross-compile the full release matrix (linux/windows/darwin x amd64/arm64),
# package each binary as a tarball (.zip for windows), and write SHA256SUMS
# over the lot. Tag pipelines only.
go-release:
  stage: build
  rules:
    - if: $CI_PROJECT_NAMESPACE == "freedom-names" && $CI_COMMIT_TAG
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends zip
  script:
    - export APP_VERSION=${CI_COMMIT_TAG}
    - ./scripts/build-release.sh
  artifacts:
    name: "FreedomNames $CI_COMMIT_TAG binaries"
    expire_in: 1 month
    paths:
      - build_release/freedom-names-*.tar.gz
      - build_release/freedom-names-*.zip
      - build_release/SHA256SUMS

# Upload packages to the Generic Package Registry, add them to the (UI-created)
# GitLab release, and mirror them to the GitHub release. Tag pipelines only.
upload_and_release:
  stage: deploy
  image: serversideup/github-cli:latest
  interruptible: false
  needs:
    - job: go-release
      artifacts: true
  rules:
    - if: $CI_PROJECT_NAMESPACE == "freedom-names" && $CI_COMMIT_TAG
  script:
    - export APP_VERSION=${CI_COMMIT_TAG}
    # Publish the exact files produced by go-release to the versioned Generic
    # Package Registry. Release links below point here, never at CI artifacts.
    - |
      set -eu
      for file in build_release/freedom-names-* build_release/SHA256SUMS; do
        curl --fail-with-body --retry 3 --retry-all-errors \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${file}" \
          "${PACKAGE_REGISTRY_URL}/$(basename "${file}")"
      done
    - ./scripts/create-release-links.sh

    # GitHub Sync (fallback to only upload if creating a release fails).
    # Uses the GH_TOKEN environment variable from GitLab CI/CD variables.
    #
    # SHA256SUMS goes up with the archives: GitHub is a second host for the same
    # bytes, so a checksum list published beside them is what lets a user check
    # that both places served the same build.
    - |
      gh release create "$CI_COMMIT_TAG" \
        build_release/freedom-names-* \
        build_release/SHA256SUMS \
        --repo "FreedomNames/FreedomNames" \
        --title "FreedomNames $CI_COMMIT_TAG" \
        --notes "FreedomNames Release $CI_COMMIT_TAG" || \
      gh release upload "$CI_COMMIT_TAG" \
        build_release/freedom-names-* \
        build_release/SHA256SUMS \
        --repo "FreedomNames/FreedomNames" \
        --clobber
  environment:
    name: production
    url: https://github.com/FreedomNames/FreedomNames/releases
  artifacts:
    name: "FreedomNames $CI_COMMIT_TAG"
    expire_in: 1 month
    paths:
      - build_release/freedom-names-*.tar.gz
      - build_release/freedom-names-*.zip
      - build_release/SHA256SUMS
